  <section id="settingsDrawer" class="settings-drawer" aria-label="Viewing settings" aria-hidden="true">
    <header><div><h3>Viewing settings</h3><span class="micro">Saved in this browser</span></div><button id="settingsClose" class="button-text" type="button">Close</button></header>
    <div class="control-group toggle-row"><label for="largeText">Larger interface text</label><input id="largeText" type="checkbox"></div>
    <div class="control-group toggle-row"><label for="lightMode">Light interface</label><input id="lightMode" type="checkbox"></div>
    <div class="control-group toggle-row"><label for="highContrast">Higher contrast</label><input id="highContrast" type="checkbox"></div>
    <div class="control-group toggle-row"><label for="reduceMotion">Reduce motion</label><input id="reduceMotion" type="checkbox"></div>
  </section>
